<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080a0f" />
  <meta name="description" content="Carlukz Prince — a new experience is coming soon. Stay tuned." />
  <title>Carlukz Prince — Coming Soon</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080a0f;
      --text: #f4f2ed;
      --muted: #9699a4;
      --accent: #d7b477;
      --line: rgba(255,255,255,.12);
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 28px;
      color: var(--text);
      background:
        radial-gradient(ellipse at 50% 42%, rgba(116, 87, 49, .18), transparent 34%),
        radial-gradient(ellipse at 80% 10%, rgba(64, 79, 112, .13), transparent 30%),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .19;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.16'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
    }

    .page {
      position: relative;
      width: min(100%, 980px);
      min-height: min(780px, calc(100svh - 56px));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      padding: 28px 18px 18px;
    }

    .topline, .footer {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .brand-mark {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
      letter-spacing: .16em;
    }

    .mark {
      width: 25px;
      height: 25px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(215,180,119,.7);
      border-radius: 50%;
      color: var(--accent);
      font-family: Georgia, serif;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0;
    }

    .status { display: inline-flex; align-items: center; gap: 9px; }
    .status::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px rgba(215,180,119,.8);
    }

    .hero {
      position: relative;
      width: 100%;
      margin: auto 0;
      padding: 72px 0 82px;
      isolation: isolate;
    }

    .orbit {
      position: absolute;
      z-index: -1;
      width: min(68vw, 510px);
      aspect-ratio: 1;
      left: 50%;
      top: 50%;
      border: 1px solid rgba(215,180,119,.13);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      animation: breathe 7s ease-in-out infinite;
    }

    .orbit::before, .orbit::after {
      content: "";
      position: absolute;
      inset: 10%;
      border: 1px solid rgba(255,255,255,.055);
      border-radius: 50%;
    }

    .orbit::after {
      inset: 22%;
      border-color: rgba(215,180,119,.09);
    }

    .eyebrow {
      margin: 0 0 25px;
      color: var(--accent);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .42em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(54px, 10vw, 108px);
      font-weight: 400;
      line-height: .98;
      letter-spacing: -.065em;
    }

    h1 span {
      display: block;
      color: var(--accent);
      font-style: italic;
      font-weight: 400;
    }

    .description {
      max-width: 440px;
      margin: 29px auto 0;
      color: #a6a8b0;
      font-size: clamp(13px, 1.6vw, 15px);
      line-height: 1.9;
      letter-spacing: .025em;
    }

    .divider {
      width: 54px;
      height: 1px;
      margin: 35px auto 0;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }

    .domain {
      margin: 18px 0 0;
      color: rgba(244,242,237,.62);
      font-size: 10px;
      letter-spacing: .28em;
      text-transform: uppercase;
    }

    .footer {
      padding-top: 20px;
      border-top: 1px solid var(--line);
      font-size: 9px;
      letter-spacing: .16em;
    }

    .footer span:last-child { text-align: right; }

    @keyframes breathe {
      0%, 100% { opacity: .65; transform: translate(-50%, -50%) scale(.97); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.03); }
    }

    @media (max-width: 600px) {
      body { padding: 16px; }
      .page { min-height: calc(100svh - 32px); padding: 18px 6px 10px; }
      .topline { font-size: 8px; letter-spacing: .12em; }
      .brand-mark { gap: 7px; }
      .mark { width: 23px; height: 23px; }
      .hero { padding: 76px 0 88px; }
      .orbit { width: min(88vw, 420px); }
      .eyebrow { font-size: 9px; letter-spacing: .3em; }
      .description { max-width: 310px; }
      .footer { font-size: 8px; letter-spacing: .1em; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topline" aria-label="Site header">
      <div class="brand-mark"><span class="mark">C</span><span>CARLUKZ PRINCE</span></div>
      <span class="status">Launching soon</span>
    </header>

    <section class="hero" aria-labelledby="main-title">
      <div class="orbit" aria-hidden="true"></div>
      <p class="eyebrow">A new beginning</p>
      <h1 id="main-title">Something<br /><span>extraordinary</span><br />is coming.</h1>
      <p class="description">We’re putting the finishing touches on something special. A fresh experience is on its way — stay tuned.</p>
      <div class="divider" aria-hidden="true"></div>
      <p class="domain">carlukzprince.com</p>
    </section>

    <footer class="footer">
      <span>© <span id="year">2026</span> Carlukz Prince</span>
      <span>Made with purpose · Coming soon</span>
    </footer>
  </main>
  <script>
    // Keep the copyright year current without requiring a build step.
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
